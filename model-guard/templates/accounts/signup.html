{% extends "auth_base.html" %}
{% block title %}Create account — ModelGuard{% endblock %}
{% block auth_content %}
<h1>Create account</h1>
<p>Join ModelGuard to upload, assess and report on machine learning models.</p>
<form method="post" class="form-grid">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Create account</button>
</form>
<p style="margin-top:18px;">Already registered? <a style="color:var(--gold-soft);" href="{% url 'accounts:login' %}">Sign in</a></p>
{% endblock %}
