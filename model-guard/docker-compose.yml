services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modelguard
      POSTGRES_USER: modelguard
      POSTGRES_PASSWORD: modelguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelguard -d modelguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_NAME: modelguard
      DB_USER: modelguard
      DB_PASSWORD: modelguard
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_NAME: modelguard
      DB_USER: modelguard
      DB_PASSWORD: modelguard
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_NAME: modelguard
      DB_USER: modelguard
      DB_PASSWORD: modelguard
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
  static-data:
